name: Export Genesys canned responses
run-name: Export canned responses (${{ inputs.region }}, ${{ inputs.scope }}, ${{ inputs.country_code }})

on:
  workflow_dispatch:
    inputs:
      region:
        description: Genesys Cloud region domain (e.g. mypurecloud.de)
        required: true
        type: string
      scope:
        description: Export all libraries or filter by country
        required: true
        type: choice
        default: country
        options:
          - country
          - all
      country_code:
        description: Two-letter country code (required for country exports)
        required: false
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export canned responses
        working-directory: canned_response_export
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          GENESYS_REGION: ${{ inputs.region }}
          EXPORT_SCOPE: ${{ inputs.scope }}
          COUNTRY_CODE: ${{ inputs.country_code }}
        run: |
          : "${CLIENT_ID:?Set the repository secret CLIENT_ID}"
          : "${CLIENT_SECRET:?Set the repository secret CLIENT_SECRET}"
          : "${GENESYS_REGION:?Provide the Genesys Cloud region domain}"
          if [[ "$EXPORT_SCOPE" == "country" ]]; then
            : "${COUNTRY_CODE:?Provide a country code for a country export}"
            python export_country_canned_responses.py "$COUNTRY_CODE"
          else
            python export_canned_responses.py
          fi

      - name: Upload exported CSV files
        uses: actions/upload-artifact@v4
        with:
          name: canned-responses-${{ github.run_id }}-${{ github.run_attempt }}
          path: canned_response_export/exports/*.csv
          if-no-files-found: error
          retention-days: 7
